<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>纺织材料学专题</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
      background: #f5f7fa;
      color: #1f2937;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .container {
      width: 100%;
      max-width: 900px;
    }

    h1 {
      margin: 0 0 8px;
      text-align: center;
      font-size: 32px;
      color: #111827;
    }

    .author {
      margin: 0 0 12px;
      text-align: center;
      font-size: 15px;
      color: #4b5563;
      letter-spacing: 0.5px;
    }

    .author #visit-count {
      color: #1d4ed8;
      font-weight: 600;
    }

    .subtitle {
      margin: 0 0 32px;
      text-align: center;
      color: #6b7280;
      font-size: 16px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 20px;
    }

    .card {
      display: block;
      padding: 28px 24px;
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      text-decoration: none;
      color: inherit;
      box-shadow: 0 4px 14px rgba(15, 23, 42, 0.06);
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
    }

    .card:hover {
      transform: translateY(-4px);
      border-color: #93c5fd;
      box-shadow: 0 10px 24px rgba(15, 23, 42, 0.12);
    }

    .card h2 {
      margin: 0 0 10px;
      font-size: 21px;
      color: #1d4ed8;
    }

    .card p {
      margin: 0;
      line-height: 1.7;
      color: #4b5563;
      font-size: 15px;
    }

    @media (max-width: 640px) {
      .cards {
        grid-template-columns: 1fr;
      }

      h1 {
        font-size: 26px;
      }
    }
  </style>
</head>
<body>
  <main class="container">
    <h1>纺织材料学专题</h1>
    <p class="author">
      梁帅童 &nbsp;|&nbsp; 纺织服装学院 &nbsp;|&nbsp; 上海工程技术大学
      &nbsp;|&nbsp; 访问量：<span id="visit-count">加载中...</span> 次
    </p>
    <p class="subtitle">请选择要查看的专题页面</p>

    <div class="cards">
      <a class="card" href="纱线线密度_特克斯旦尼尔支数_专题.html">
        <h2>纱线线密度</h2>
        <p>特克斯、旦尼尔、支数专题</p>
      </a>

      <a class="card" href="应力应变模量与曲线_纤维织物_课堂专题.html">
        <h2>应力应变模量与曲线</h2>
        <p>纤维织物课堂专题</p>
      </a>
    </div>
  </main>

  <script>
    (function () {
      // 命名空间与键名：可在后续多页面统计中复用同一套命名规则
      const NAMESPACE = "liang-shuaitong-su" + "es"; // 唯一命名空间
      const KEY = "index-page";                      // 页面唯一键
      const COUNT_URL = "https://api.counterapi.dev/v1";

      const counterEl = document.getElementById("visit-count");
      const storageKey = "visited_" + NAMESPACE + "_" + KEY;

      async function updateCounter() {
        try {
          const hasVisited = localStorage.getItem(storageKey);

          // 已访问过：只读取当前值；首次访问：先自增再返回
          const endpoint = hasVisited
            ? `${COUNT_URL}/${NAMESPACE}/${KEY}/`
            : `${COUNT_URL}/${NAMESPACE}/${KEY}/up`;

          const response = await fetch(endpoint);
          if (!response.ok) throw new Error("HTTP " + response.status);

          const data = await response.json();
          counterEl.textContent = data.count;

          if (!hasVisited) {
            localStorage.setItem(storageKey, "true");
          }
        } catch (err) {
          counterEl.textContent = "—";
          console.warn("访问计数器加载失败：", err);
        }
      }

      updateCounter();
    })();
  </script>
</body>
</html>
